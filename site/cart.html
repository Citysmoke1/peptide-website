<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart | The Aurum Peptide Co</title>
<meta name="description" content="Review your cart before checkout.">
<link rel="icon" href="assets/img/logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="cart" data-root="">

<div id="site-header"></div>

<div class="page-banner"><h1>Your Cart</h1><p>Review your selections before submitting your order.</p></div>

<section class="section">
  <div class="container">
    <div id="cartHasItems" style="display:none;">
      <div class="two-col" style="align-items:flex-start;">
        <div>
          <table class="cart-table">
            <thead><tr><th>Product</th><th>Price</th><th>Qty</th><th>Total</th><th></th></tr></thead>
            <tbody id="cartRows"></tbody>
          </table>
        </div>
        <div class="summary-card">
          <h3 style="margin-top:0;">Order Summary</h3>
          <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal"></span></div>
          <div class="summary-row"><span>Shipping</span><span>Calculated at checkout</span></div>
          <div class="summary-row total"><span>Estimated Total</span><span id="sumTotal"></span></div>
          <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:16px;">Proceed to Checkout</a>
          <a href="shop.html" class="btn btn-outline btn-block" style="margin-top:10px;">Continue Shopping</a>
        </div>
      </div>
    </div>

    <div id="cartEmpty" class="empty-state" style="display:none;">
      <div class="ic">&#128722;</div>
      <h2>Your cart is empty</h2>
      <p class="muted">Browse our research peptide range to get started.</p>
      <a href="shop.html" class="btn btn-primary">Shop All Peptides</a>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/header.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/footer.js"></script>
<script>
(function(){
  var Q = window.Aurum;
  function render(){
    var items = window.AurumCart.read();
    if(!items.length){
      document.getElementById('cartHasItems').style.display = 'none';
      document.getElementById('cartEmpty').style.display = 'block';
      return;
    }
    document.getElementById('cartHasItems').style.display = 'block';
    document.getElementById('cartEmpty').style.display = 'none';

    var rows = document.getElementById('cartRows');
    rows.innerHTML = items.map(function(item, idx){
      var p = window.AURUM_getProduct(item.slug);
      if(!p) return '';
      return '<tr>'
        + '<td><div class="cart-item-info"><div class="thumb">' + Q.vialSVG(window.AurumRender.initials(p.name)) + '</div>'
        + '<div><a href="product.html?slug=' + p.slug + '" style="font-weight:700;">' + p.name + '</a><br><span class="muted" style="font-size:.82rem;">' + item.option + '</span></div></div></td>'
        + '<td>' + Q.formatPrice(item.price) + '</td>'
        + '<td><input type="number" min="1" value="' + item.qty + '" data-idx="' + idx + '" class="qtyEdit" style="width:70px;padding:6px 8px;"></td>'
        + '<td>' + Q.formatPrice(item.price * item.qty) + '</td>'
        + '<td><button class="remove-link" data-idx="' + idx + '">Remove</button></td>'
        + '</tr>';
    }).join('');

    document.getElementById('sumSubtotal').textContent = Q.formatPrice(window.AurumCart.subtotal());
    document.getElementById('sumTotal').textContent = Q.formatPrice(window.AurumCart.subtotal());

    Q.qsa('.remove-link', rows).forEach(function(btn){
      btn.addEventListener('click', function(){ window.AurumCart.remove(Number(btn.getAttribute('data-idx'))); render(); });
    });
    Q.qsa('.qtyEdit', rows).forEach(function(inp){
      inp.addEventListener('change', function(){ window.AurumCart.updateQty(Number(inp.getAttribute('data-idx')), Number(inp.value)); render(); });
    });
  }
  render();
})();
</script>
</body>
</html>
